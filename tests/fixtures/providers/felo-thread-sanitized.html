st. Understand move semantics and discover patterns to work with ownership correctly.\n\nBy @nawazdhandala•Jan 25, 2026Reading time\n\n## On this page\n\n------\n\nThe \"use of moved value\" error is one of Rust's most common ownership errors. It occurs when you try to use a value after its ownership has been transferred somewhere else. This guide explains the error and provides practical solutions.\n\n## Understanding the Error\n\nIn Rust, assignment moves ownership for non-Copy types:\n\n```rust\nfn main() {\n    let s1 = String::from(\"hello\");\n    let s2 = s1;  // Ownership moves from s1 to s2\n\n    // println!(\"{}\", s1);  // Error: value used here after move\n    println!(\"{}\", s2);  // OK: s2 owns the value\n}\n```\n\nError message:\n\n```text\nerror[E0382]: borrow of moved value: `s1`\n --> src/main.rs:5:20\n  |\n2 |     let s1 = String::from(\"hello\");\n  |         -- move occurs because `s1` has type `String`, which does not implement the `Copy` trait\n3 |     let s2 = s1;\n  |              -- value moved here\n4 |\n5 |     println!(\"{}\", s1);\n  |                    ^^ value borrowed here after move\n```\n\n## Copy vs Move Types\n\nTypes implementing `Copy` are copied, not moved:\n\n```rust\nfn main() {\n    // Copy types - both variables remain valid\n    let x = 5;\n    let y = x;\n    println!(\"x = {}, y = {}\", x, y);  // Both work\n\n    let a = true;\n    let b = a;\n    println!(\"a = {}, b = {}\", a, b);  // Both work\n\n    // Move types - only new owner is valid\n    let s1 = String::from(\"hello\");\n    let s2 = s1;\n    // println!(\"{}\", s1);  // Error: moved\n    println!(\"{}\", s2);\n\n    let v1 = vec![1, 2, 3];\n    let v2 = v1;\n    // println!(\"{:?}\", v1);  // Error: moved\n    println!(\"{:?}\", v2);\n}\n```\n\n| Scenario | Fix |\n| --- | --- |\n| Need independent copy | `clone()` |\n| Just need to read | Use `&amp;` reference |\n| Function needs ownership | Return value back |\n| Loop iteration | Use `&amp;collection` or `iter()` |\n| Closure capture | Clone before move, or don't use `move` |\n| Optional value | `as\\_ref()`, `clone()`, or `take()` |\n| Conditional | Restructure or clone |\n\n## Prevention Tips\n\n**Start with references**: Use `&amp;` by default, only take ownership when needed**Understand your types**: Know which types are Copy vs Move**Check function signatures**: Does the function take `T`, `&amp;T`, or `&amp;mut T`?**Be careful with closures**: `move` closures consume captured variables**Use iterators wisely**\n\nNawaz is building OneUptime with a passion for engineering reliable systems and improving observability.\n\nTechnically validated· Jun 15, 2026 View report\n\n### Help improve this post\n\nEvery OneUptime blog post is open source. Found a typo, an inaccuracy, or have a clearer way to explain something? Anyone can contribute — your edits make this post better for everyone who reads it next.\n\nOneUptime is the Open-Source\nObservability PlatformYour complete reliability stack unified: infrastructure monitoring, incident management, status pages, and APM. Open-source and self-hostable.\n\nEdit this post on GitHub Contributing guidelines AI\n\nDetect, diagnose, and resolve incidents with AI-powered root cause analysis and code fixes."}, {"link": "https://oneuptime.com/blog/post/2026-01-25-fix-value-borrowed-after-move-rust/view", "title": "How to Fix 'Value borrowed here after move' Errors", "snippet": "Learn how to diagnose and fix 'value borrowed here after move' errors in Rust. Understand move semantics and discover patterns to work with ownership correctly.\n\nBy @nawazdhandala•Jan 25, 2026Reading time\n\n## On this page\n\n------\n\nThe \"value borrowed here after move\" error occurs when you try to use a value after its ownership has been transferred elsewhere. This guide explains why moves happen and how to fix these errors.\n\n## Understanding Moves\n\nIn Rust, assignment and passing values to functions moves ownership by default for non-Copy types:\n\n```rust\nfn main() {\n    let s1 = String::from(\"hello\");\n    let s2 = s1;  // s1 is moved to s2\n\n    // println!(\"{}\", s1);  // Error: value borrowed here after move\n    println!(\"{}\", s2);  // OK: s2 owns the data\n}\n```\n\n```rust\nfn main() {\n    // Copy types - both variables valid\n    let x = 5;\n    let y = x;\n    println!(\"x = {}, y = {}\", x, y);  // Both work\n\n    // Move types - only new owner valid\n    let s1 = String::from(\"hello\");\n    let s2 = s1;\n    // println!(\"{}\", s1);  // Error\n    println!(\"{}\", s2);  // OK\n\n    // Vec moves\n    let v1 = vec![1, 2, 3];\n    let v2 = v1;\n    // println!(\"{:?}\", v1);  // Error\n    println!(\"{:?}\", v2);  // OK\n}\n```\n\n## Fix 1: Clone the Value\n\nMake a copy when you need the original to remain valid:\n\n```rust\nfn main() {\n    let s1 = String::from(\"hello\");\n    let s2 = s1.clone();  // Deep copy\n\n    println!(\"s1 = {}\", s1);  // OK: s1 still valid\n    println!(\"s2 = {}\", s2);  // OK: s2 is independent copy\n}\n```\n\nBe aware that clone can be expensive for large data:\n\n```rust\nfn main() {\n    let mut maybe_string: Option<String> = Some(String::from(\"hello\"));\n\n    // Take the value out, leaving None\n    if let Some(s) = maybe_string.take() {\n        println!(\"Took: {}\", s);\n    }\n\n    println!(\"Now: {:?}\", maybe_string);  // None\n}\n```\n\n## Fix 5: Use std::mem::replace\n\nReplace a value and get the old one:\n\n```rust\nuse std::mem;\n\nfn main() {\n    let mut s = String::from(\"hello\");\n\n    // Replace s with new value, get old value back\n    let old = mem::replace(&mut s, String::from(\"world\"));\n\n    println!(\"Old: {}\", old);\n    println!(\"New: {}\", s);\n}\n```\n\n## Moves in Loops\n\nEdit this post on GitHub Contributing guidelines AI\n\nDetect, diagnose, and resolve incidents with AI-powered root cause analysis and code fixes."}, {"link": "https://www.reddit.com/r/rust/comments/y7d1gp/use_of_moved_value_in_control_f
