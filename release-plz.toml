[workspace]
# crates.io is the source of truth for published package versions.
publish = true
git_tag_name = "v{{ version }}"

# Only release after the generated release PR has been reviewed and merged.
release_always = false
# Only product fixes/features prepare a release; maintenance-only commits do not.
release_commits = '^(feat|fix)(\([^)]*\))?!?:'

# cargo-dist creates the GitHub release and uploads its artifacts after the tag
# is pushed. release-plz owns only the version bump, changelog, and tag.
git_release_enable = false
changelog_update = true
pr_labels = ["release"]
semver_check = true
